# Move the video buffer to fill the 32k SRAM2 block.
CONFIG_LV_Z_VBD_CUSTOM_SECTION=y
CONFIG_LV_Z_VDB_SIZE=14

# Enable filesystem and POSIX APIs
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_POSIX_API=y
CONFIG_DISK_ACCESS=y
CONFIG_FAT_FILESYSTEM_ELM=y

# Enable newlib libc to support SQLite
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# Optional: Disable unneeded features for SQLite
CONFIG_MINIMAL_LIBC=n

# Enable the GAP Bluetooth observer connection-less role
CONFIG_BT_OBSERVER=y